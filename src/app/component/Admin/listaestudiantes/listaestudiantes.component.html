<div class="container">
    <div class="form-group row">
      <div class="col-sm text-center">
        <h4  class="d-block" style="background-color: #f09697; color:#fff; margin: 15px;">Lista de Alumno</h4>
       
      </div>
    </div>

    <button (click)="exportToExcel()"  class="btn btn-secondary"
    style="background-color: #f09697;">Export to Excel</button>
    <br>

    <input type="text" [(ngModel)]="searchterm" placeholder="Buscar cadena">

    <label class="ms-3">Mostrar:
      <select [ngModel]="view" (ngModelChange)="view = $event; page = 1; applyView()">
        <option value="finished">Terminados en {{ cycleYear }}</option>
        <option value="all">Todos los alumnos</option>
      </select>
    </label>
    <strong class="ms-3" *ngIf="view == 'finished'">{{ rows.length }} cursos terminados en {{ cycleYear }}</strong>

    <pagination-controls (pageChange)="page = $event"></pagination-controls>
  
  <table class="table" *ngIf="data">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nombre</th>       
        <th scope="col">Email</th>   
        <th scope="col">Fecha de registro</th>
        <th scope="col">Curso terminado</th>
        <th scope="col">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let ems of rows  | filterpipe: searchterm | paginate: { itemsPerPage: 50, currentPage: page }">
        <th scope="row">{{ ems.id }}</th>
        <td>{{ ems.name }}</td>
        <td>{{ ems.email }}</td>   
        <td>{{ ems.created_at.substring(0, 16).replace('T', ' ')}}</td>
        <td>{{ ems.finished_at || '—' }}</td>
        <td>
            <button type="button" class="btn  btn-outline-primary" title="Ver Resultados" (click)="verquiz(ems)">Ver Resultados</button>
            <!-- TODO delete user: uncomment once the backend is deployed, together with the token line in login.component.ts
            <button type="button" class="btn btn-danger ms-2" title="Eliminar usuario" [disabled]="ems.id == Constants.userId" (click)="eliminar(ems)">Eliminar</button>
            -->
        </td>
      </tr>
    </tbody>
  </table>
