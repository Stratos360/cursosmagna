

<div class="container">
    <div class="form-group row">
        <div class="col-sm text-center">
          <h4  class="d-block" style="background-color: #f09697; color:#fff; margin: 15px;"> Aprendizaje de usuarios</h4>

        </div>
      </div>

      <div class="chart-container">

        <div class="chart-wrapper" *ngFor="let chart of quizCharts">
          <p>{{chart.title}}</p>
          <canvas baseChart width="480" height="300"
          [data]="chart.data"
          [options]="barChartOptions"
          [plugins]="barChartPlugins"
          [legend]="barChartLegend"
          >
          </canvas>
        </div>

      </div>

</div>
